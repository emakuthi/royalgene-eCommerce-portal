<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circle with thread pattern -->
  <circle cx="20" cy="20" r="16" stroke="url(#gradient)" stroke-width="2" fill="none"/>
  <path d="M 12 20 Q 16 12, 20 20 T 28 20" stroke="url(#gradient)" stroke-width="1.5" fill="none"/>
  <path d="M 12 24 Q 16 16, 20 24 T 28 24" stroke="url(#gradient)" stroke-width="1.5" fill="none"/>

  <!-- Text -->
  <text x="44" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#gradient)">
    Elegante
  </text>
  <text x="44" y="30" font-family="Arial, sans-serif" font-size="9" fill="#64748b" letter-spacing="1">
    TEXTILES
  </text>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
