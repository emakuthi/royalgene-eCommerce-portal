name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/emakuthi/royalgene-ecommerce-portal
  # The portal's application in Coolify (its containers are named <uuid>-<time>).
  COOLIFY_APP_UUID: l16bf9d6tsvcg8vjjzcxkdh5

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'branch-test' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN }}

      # Point the Coolify app at the image just built and redeploy it, so a merge
      # to main goes live without editing the tag by hand. Skipped (not failed)
      # until COOLIFY_URL and COOLIFY_TOKEN are set as repository secrets.
      - name: Deploy to Coolify
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_URL / COOLIFY_TOKEN not set, so not deploying. Set the image tag in Coolify to ${GITHUB_SHA} by hand."
            exit 0
          fi
          api="${COOLIFY_URL%/}/api/v1"
          # Fail on anything but 2xx. A redirect (e.g. Cloudflare sending http:// to
          # https://, or to an Access login) means Coolify never saw the request.
          call() {
            code=$(curl -sS -o /tmp/coolify.out -w '%{http_code} %{redirect_url}' "$@" -H "Authorization: Bearer $COOLIFY_TOKEN")
            echo "HTTP $code"; head -c 1000 /tmp/coolify.out; echo
            case "$code" in 2*) ;; *) echo "::error::Coolify API call failed (HTTP $code). Check COOLIFY_URL (https://, no Cloudflare Access) and the token."; exit 1 ;; esac
          }
          call -X PATCH "$api/applications/$COOLIFY_APP_UUID" -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\":\"${GITHUB_SHA}\"}"
          call "$api/deploy?uuid=$COOLIFY_APP_UUID"
          echo "Deploy of ${GITHUB_SHA} queued in Coolify."
